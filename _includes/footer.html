<footer class="site-footer">
  <div>
    <strong>RemoSIM</strong> — Open Source Remote SIM Management & Softphone Gateway.
    <div style="font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem;">
      Powered by Raspberry Pi, Asterisk PBX, chan_dongle, Telegram 2FA Bot, and WebRTC.
    </div>
  </div>

  <div class="footer-social-links">
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer" aria-label="{{ item.icon }}">
        <i class="fab fa-{{ item.icon }}"></i>
      </a>
    {% endfor %}
  </div>
</footer>
